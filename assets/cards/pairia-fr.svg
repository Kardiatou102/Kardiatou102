<svg xmlns="http://www.w3.org/2000/svg" width="460" height="236" viewBox="0 0 460 236" role="img" aria-label="PairIA">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/></linearGradient>
  <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="bar"><rect x="0" y="0" width="460" height="4" rx="2"/></clipPath>
  <style>
    .t { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .card { animation: up .7s 0.00s ease-out backwards; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } }
  </style>
</defs>
<g class="card">
  <rect x="1" y="1" width="458" height="234" rx="16" fill="url(#bg)" stroke="#d8dee4"/>
  <g transform="translate(16,1)" clip-path="url(#bar)">
    <rect width="428" height="4" fill="#a8577e"/>
    <rect x="-140" width="120" height="4" fill="url(#shine)"><animate attributeName="x" values="-140;460;460" keyTimes="0;.5;1" dur="5s" begin="1.00s" repeatCount="indefinite"/></rect>
  </g>
  <circle cx="50" cy="54" r="24" fill="#a8577e" fill-opacity=".15" stroke="#a8577e" stroke-opacity=".5"/>
  <text x="50" y="62" text-anchor="middle" font-size="22">🤖</text>
  <text x="88" y="50" class="t" font-size="20" font-weight="700" fill="#24292f">PairIA</text>
  <text x="88" y="72" class="t" font-size="13" fill="#a8577e">Chatbot IA pour l'e-commerce</text>
  <text x="434" y="34" text-anchor="end" class="t" font-size="12" fill="#57606a">Voir le dépôt ↗</text>
  <text x="26" y="116" class="t" font-size="13.5" fill="#57606a">Boutique de chaussures avec un assistant IA 100 % local :</text><text x="26" y="137" class="t" font-size="13.5" fill="#57606a">recherche en langage naturel, par image (CLIP) ou à la voix</text><text x="26" y="158" class="t" font-size="13.5" fill="#57606a">(Whisper), 75 langues, chatbot admin à 25 outils.</text>
  <rect x="26" y="190" width="109" height="24" rx="12" fill="#a8577e" fill-opacity=".14"/><text x="81" y="206" text-anchor="middle" class="t" font-size="12" fill="#a8577e">Deep Learning</text><rect x="142" y="190" width="42" height="24" rx="12" fill="#a8577e" fill-opacity=".14"/><text x="163" y="206" text-anchor="middle" class="t" font-size="12" fill="#a8577e">NLP</text><rect x="192" y="190" width="42" height="24" rx="12" fill="#a8577e" fill-opacity=".14"/><text x="213" y="206" text-anchor="middle" class="t" font-size="12" fill="#a8577e">RAG</text><rect x="241" y="190" width="82" height="24" rx="12" fill="#a8577e" fill-opacity=".14"/><text x="282" y="206" text-anchor="middle" class="t" font-size="12" fill="#a8577e">CamemBERT</text><rect x="330" y="190" width="82" height="24" rx="12" fill="#a8577e" fill-opacity=".14"/><text x="371" y="206" text-anchor="middle" class="t" font-size="12" fill="#a8577e">LLaMA 3.1</text>
</g>
</svg>